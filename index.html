<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budget Mensuel Marine</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:15px;background:#f5f7fb}.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px;box-shadow:0 2px 6px rgba(0,0,0,.1)}.row{display:flex;gap:8px;margin:6px 0;align-items:center}.row input[type=text]{flex:1}input{padding:8px;border:1px solid #ccc;border-radius:6px}button{border:none;border-radius:6px;padding:8px 12px;cursor:pointer}.green{background:#16a34a;color:#fff}.blue{background:#2563eb;color:#fff}.red{background:#dc2626;color:#fff}.gray{background:#6b7280;color:#fff}</style></head><body><h1>💰 Budget Mensuel Marine</h1><div class="card"><label>Solde actuel (€)</label><br><input id="solde" type="number" step="0.01" value="0"></div><div class="card"><h3>Dépenses fixes <button class="green" onclick="addFixe()">+ Ajouter</button></h3><div id="fixes"></div></div><div class="card"><h3>Dépenses variables <button class="green" onclick="addVar()">+ Ajouter</button></h3><div id="vars"></div></div><button class="blue" onclick="calculer()">Calculer</button> <button class="gray" onclick="resetMois()">Réinitialiser le mois</button><div class="card"><div id="result">Disponible : 0 €</div><div id="detail"></div></div><script>const KEY='budget-marine-v1';const defaults={fixes:[['FREE',50],['Basic Fit',34.99],['Assurance Dacia',70],['CB SG',10],['Téléphone',8.99],['Prêt appartement',504.90],['Assurance prêt appartement',8.10]],vars:[['Courses',400,true],['Essence',150,true],['Restaurant',80,false]]};let data=JSON.parse(localStorage.getItem(KEY)||'null')||defaults;function save(){localStorage.setItem(KEY,JSON.stringify(data));}function render(){let f=document.getElementById('fixes');f.innerHTML='';data.fixes.forEach((d,i)=>{let r=document.createElement('div');r.className='row';r.innerHTML=`<input type=text value="${d[0]}"><input type=number value="${d[1]}"><button class="red">🗑️</button>`;let e=r.querySelectorAll('input');e[0].oninput=x=>{data.fixes[i][0]=x.target.value;save();};e[1].oninput=x=>{data.fixes[i][1]=Number(x.target.value)||0;save();};r.querySelector('button').onclick=()=>{data.fixes.splice(i,1);save();render();};f.appendChild(r);});let v=document.getElementById('vars');v.innerHTML='';data.vars.forEach((d,i)=>{let r=document.createElement('div');r.className='row';r.innerHTML=`<input type=checkbox ${d[2]?'checked':''}><input type=text value="${d[0]}"><input type=number value="${d[1]}"><button class="red">🗑️</button>`;let e=r.querySelectorAll('input');e[0].onchange=x=>{data.vars[i][2]=x.target.checked;save();};e[1].oninput=x=>{data.vars[i][0]=x.target.value;save();};e[2].oninput=x=>{data.vars[i][1]=Number(x.target.value)||0;save();};r.querySelector('button').onclick=()=>{data.vars.splice(i,1);save();render();};v.appendChild(r);});}function addFixe(){data.fixes.push(['Nouvelle dépense',0]);save();render();}function addVar(){data.vars.push(['Nouvelle dépense',0,true]);save();render();}function resetMois(){document.getElementById('solde').value=0;data.vars.forEach(v=>v[2]=false);save();render();}function calculer(){let solde=Number(document.getElementById('solde').value)||0;let fixes=data.fixes.reduce((a,b)=>a+Number(b[1]||0),0);let vars=data.vars.filter(v=>v[2]).reduce((a,b)=>a+Number(b[1]||0),0);let dispo=solde-fixes-vars;document.getElementById('result').innerHTML='Disponible : '+dispo.toFixed(2)+' €';document.getElementById('detail').innerHTML='Charges fixes : '+fixes.toFixed(2)+' €<br>Variables : '+vars.toFixed(2)+' €';}render();</script></body></html>
