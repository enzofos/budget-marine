<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budget Marine Family Sync</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Segoe UI,sans-serif;background:#0f172a;color:#fff;max-width:1200px;margin:auto;padding:20px}.card{background:#1e293b;padding:15px;border-radius:12px;margin:12px 0}input,select,button{padding:8px;margin:4px;border:none;border-radius:8px}button{background:#2563eb;color:#fff}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #475569}</style></head><body><h1>💰 Budget Marine Family Sync</h1><div class='card'><h2>Paramètres</h2><input id='salary' type='number' placeholder='Salaire Marine (€)'><button onclick='saveSalary()'>Enregistrer</button></div><div class='card'><h2>Nouvelle opération</h2><input id='category' placeholder='Catégorie'><input id='description' placeholder='Description'><input id='amount' type='number' placeholder='Montant €'><input id='expenseDate' type='date'><button onclick='addEntry()'>Ajouter</button></div><div class='card'><h2>📊 Tableau de bord</h2><div id='dashboard'></div></div><div class='card'><div id='table'></div></div><script src='app.js'></script></body></html>
